# DE0CH fork: build the iOS app under Deyao's team (S64YL394S3) and upload it to TestFlight.
# Cloud-managed signing with the App Store Connect API key: no certificates or profiles in git.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the Admin key's .p8 text).
name: DE0CH iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - "apps/swabble/**"
      - ".github/workflows/de0ch-ios-testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (false = build and test only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: de0ch-ios-testflight
  cancel-in-progress: false

env:
  NODE_VERSION: "24.21.0"
  IOS_DEVELOPMENT_TEAM: S64YL394S3
  OPENCLAW_IOS_APP_BUNDLE_ID: dev.de0ch.openclaw
  OPENCLAW_IOS_APP_GROUP_ID: group.dev.de0ch.openclaw.shared
  OPENCLAW_IOS_CODE_SIGN_STYLE: Automatic
  OPENCLAW_IOS_CODE_SIGN_IDENTITY: Apple Development
  OPENCLAW_IOS_APNS_ENTITLEMENT_ENVIRONMENT: production
  IOS_SIGNING_REQUIRED: "1"

jobs:
  testflight:
    if: github.repository == 'DE0CH/openclaw'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: "off"
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install pinned Swift build tools
        run: |
          set -euo pipefail
          swift_tools_dir="${RUNNER_TEMP}/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Install Watch Rust toolchain
        if: hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Write the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/key.p8"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          ./scripts/ios-configure-signing.sh
          ./scripts/ios-write-version-xcconfig.sh --build-number "$((1000 + GITHUB_RUN_NUMBER))"
          node scripts/ios-write-swift-filelist.mjs
          cd apps/ios
          xcodegen generate
          cat .local-signing.xcconfig

      - name: Run the Jarvis tests
        # Ad-hoc signed (not CODE_SIGNING_ALLOWED=NO): the header store needs the simulator Keychain.
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          simulator="$(select_ios_test_simulator)"
          cd apps/ios
          xcodebuild test \
            -project OpenClaw.xcodeproj -scheme OpenClaw \
            -destination "id=$simulator" \
            -only-testing:OpenClawLogicTests/JarvisModelsTests \
            -only-testing:OpenClawTests/JarvisDirectoryTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | tail -n 200
          test "${PIPESTATUS[0]}" = 0

      - name: Archive (unsigned, then ad-hoc signed with each target's entitlements)
        # Signing at archive time makes automatic signing mint a new Apple Development certificate on
        # every fresh runner, and the team is at Apple's certificate limit (claude-env lessons/75). The
        # archive is built unsigned; the export below signs every target (app, share extension,
        # activity widget, watch app) with Apple's cloud-managed distribution certificate.
        # An unsigned bundle asks for no entitlements and the export keeps only what a bundle asks for,
        # so each bundle gets an ad-hoc signature (no certificate) carrying its entitlements first.
        run: |
          set -euo pipefail
          cd apps/ios
          set +e
          xcodebuild archive \
            -project OpenClaw.xcodeproj -scheme OpenClaw -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/OpenClaw.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          set -e
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" "$RUNNER_TEMP/archive.log" | tail -n 120 || true
          tail -n 40 "$RUNNER_TEMP/archive.log"
          test "$status" = 0

          ent="$RUNNER_TEMP/entitlements"
          mkdir -p "$ent"
          # the Release entitlements files with their build settings filled in
          sed -e "s/\$(OPENCLAW_APNS_ENTITLEMENT_ENVIRONMENT)/$OPENCLAW_IOS_APNS_ENTITLEMENT_ENVIRONMENT/" \
              -e "s/\$(OPENCLAW_ACTIVE_APP_GROUP_ID)/$OPENCLAW_IOS_APP_GROUP_ID/" \
              Sources/OpenClaw.entitlements > "$ent/app.plist"
          sed -e "s/\$(OPENCLAW_ACTIVE_APP_GROUP_ID)/$OPENCLAW_IOS_APP_GROUP_ID/" \
              ShareExtension/OpenClawShareExtension.entitlements > "$ent/share.plist"
          if grep -q '\$(' "$ent"/*.plist; then echo "unfilled build setting in an entitlements file"; exit 1; fi
          plutil -lint "$ent"/*.plist

          app="$(ls -d "$RUNNER_TEMP"/OpenClaw.xcarchive/Products/Applications/*.app | head -1)"
          # deepest bundles first, so each bundle is signed after everything inside it
          find "$app" \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" -o -name "*.app" \) -print \
            | awk '{ print gsub("/", "/"), $0 }' | sort -rn | cut -d' ' -f2- | while IFS= read -r b; do
              args=()
              if [ -d "$b" ] && [ -f "$b/Info.plist" ]; then
                case "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$b/Info.plist" 2>/dev/null || true)" in
                  "$OPENCLAW_IOS_APP_BUNDLE_ID") args=(--entitlements "$ent/app.plist" --generate-entitlement-der) ;;
                  "$OPENCLAW_IOS_APP_BUNDLE_ID.share") args=(--entitlements "$ent/share.plist" --generate-entitlement-der) ;;
                esac
              fi
              echo "ad-hoc sign: ${b#$app/} ${args[*]:+(entitlements)}"
              codesign --force --sign - --timestamp=none ${args[@]+"${args[@]}"} "$b"
            done
          codesign -d --entitlements - "$app" 2>&1 | grep -E "aps-environment|application-groups|healthkit" -A1
          codesign --verify --deep --strict "$app"

      - name: Export (cloud-signed) and check the distribution entitlements
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          write_options() {
            cat > "$2" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          }
          write_options export "$RUNNER_TEMP/ExportOptions-ipa.plist"
          write_options upload "$RUNNER_TEMP/ExportOptions.plist"
          echo "export_options=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenClaw.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-ipa.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -n 30
          test "${PIPESTATUS[0]}" = 0
          mkdir -p "$RUNNER_TEMP/ipa/x"
          ditto -x -k "$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)" "$RUNNER_TEMP/ipa/x"
          app="$(ls -d "$RUNNER_TEMP"/ipa/x/Payload/*.app | head -1)"
          check() { # bundle, required entitlement keys
            local b="$1"; shift
            local e; e="$(codesign -d --entitlements - --xml "$b" 2>/dev/null)"
            echo "$(basename "$b"): $(codesign -dvv "$b" 2>&1 | grep -m1 '^Authority=')"
            for k in "$@"; do grep -q "<key>$k</key>" <<<"$e" || { echo "  missing $k"; exit 1; }; done
          }
          check "$app" aps-environment com.apple.security.application-groups com.apple.developer.healthkit
          grep -A1 "<key>aps-environment</key>" <<<"$(codesign -d --entitlements - --xml "$app" 2>/dev/null)" | grep -q "$OPENCLAW_IOS_APNS_ENTITLEMENT_ENVIRONMENT"
          n=0
          for b in "$app"/PlugIns/*.appex "$app"/Watch/*.app; do
            n=$((n + 1))
            if [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$b/Info.plist")" = "$OPENCLAW_IOS_APP_BUNDLE_ID.share" ]; then
              check "$b" application-identifier com.apple.security.application-groups
            else
              check "$b" application-identifier
            fi
          done
          test "$n" = 3 || { echo "expected the share extension, the activity widget and the watch app, found $n"; exit 1; }

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenClaw.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 30
          test "${PIPESTATUS[0]}" = 0
          grep -q "EXPORT SUCCEEDED\|Upload succeeded" "$RUNNER_TEMP/export.log"

      - name: Export logs
        if: failure()
        run: |
          for d in "${TMPDIR:-/tmp}"/*.xcdistributionlogs; do
            [ -d "$d" ] || continue
            echo "== $d"; ls "$d"
            for f in "$d"/IDEDistribution.standard.log "$d"/IDEDistribution.critical.log; do
              [ -f "$f" ] && grep -v -i -E "privatekey|BEGIN PRIVATE" "$f" | grep -i -E -B2 -A8 "error|fail|401|403|auth" | tail -n 200
            done
          done

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
